[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hearthforge"
version = "0.1.0"
description = "A local-first, modular AI development workstation with a real coding agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "YOUR NAME", email = "you@example.com" }]  # TODO: edit
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.6", "psutil>=5.9", "keyring>=24"]

[project.optional-dependencies]
docs = ["pypdf>=4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "pypdf>=4"]

[project.scripts]
hearthforge = "hearthforge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hearthforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "B008", "B904", "E701", "E702", "E401"]

[tool.ruff.lint.per-file-ignores]
"tests/ui/serve.py" = ["E402", "E702", "E401"]
